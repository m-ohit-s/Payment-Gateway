payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: SUCCESS
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 100
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

settlement:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    min-delay-seconds: 2
    max-delay-seconds: 6
    success-rate: 90

app:
  kafka:
    topics:
      payment: payment.events
      order: order.events
      refund: refund.events
      settlement: settlement.events

  rate-limit:
    method: bucket-lua
    use-case:
     api-key:
       requests-per-min: 10

  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
